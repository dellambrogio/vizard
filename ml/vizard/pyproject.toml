[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizard"
version = "0.1.0"
description = "Generic training library: training flow, base classes, jobs, tracking, storage"
requires-python = ">=3.12"
dependencies = [
    "click",
    "hydra-core",
    "loguru",
    "numpy",
    "omegaconf",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "torch",
    "torchtnt",
    "wandb",
    # torchtnt 0.2.4 imports pkg_resources, removed from newer setuptools
    "setuptools<81",
]

# The package is vizard (namespace packages, no __init__.py): the wheel puts the files of this
# folder under vizard/, and the editable install puts ml/ on sys.path.
[tool.hatch.build.targets.wheel]
include = ["**/*.py"]
exclude = ["tests/**"]
sources = { "" = "vizard/" }

[tool.hatch.build]
dev-mode-dirs = [".."]
