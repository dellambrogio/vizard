[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizard-mnist"
version = "0.1.0"
description = "MNIST digit classification, trained with vizard"
requires-python = ">=3.12"
dependencies = [
    "vizard",
    "click",
    "hydra-core",
    "loguru",
    "numpy",
    "omegaconf",
    "onnxruntime",
    "pillow",
    "torch",
    "torchtnt",
]

[tool.uv.sources]
vizard = { workspace = true }

# The package is projects.mnist (namespace packages, no __init__.py): the wheel puts the files
# of this folder under projects/mnist/, and the editable install puts the repo root on sys.path.
[tool.hatch.build.targets.wheel]
include = ["**/*.py", "**/*.yaml"]
exclude = ["tests/**"]
sources = { "" = "projects/mnist/" }

[tool.hatch.build]
dev-mode-dirs = ["../.."]
